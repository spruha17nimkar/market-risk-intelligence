[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-intelligence"
version = "0.1.0"
description = "Cross-asset market risk intelligence: rolling VaR/ES, regime-aware backtesting, an interpretable stress classifier and model governance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Spruha Nimkar" }]
keywords = ["market-risk", "value-at-risk", "expected-shortfall", "frtb", "backtesting", "sr-11-7", "stress-testing"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "streamlit>=1.30", "plotly>=5.18"]

[project.scripts]
mrif = "mrif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrif = ["default.toml", "dashboard/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
